# ─────────────────────────────────────────────────────────────────────────────
# docker.yml  — runs on merge to main
#
# Jobs:
#   docker-build  → builds the Docker image, runs the smoke-test RUN command
#                   baked into the Dockerfile, pushes to GHCR on success
#
# Image is tagged:
#   ghcr.io/<owner>/code-review-crew:latest
#   ghcr.io/<owner>/code-review-crew:<git-sha>
# ─────────────────────────────────────────────────────────────────────────────

name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/code-review-crew

jobs:

  docker-build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false               # build only first — smoke-test before push
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha     # GitHub Actions layer cache
          cache-to: type=gha,mode=max
          load: true                # load into local Docker daemon for smoke test

      - name: Smoke test — imports
        # The Dockerfile already has this RUN step baked in during build,
        # but we run it again here explicitly to surface failures clearly
        run: |
          docker run --rm \
            -e LLM_PROVIDER=mock \
            -e OPENAI_API_KEY=sk-test-dummy \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python -c "
          import crewai
          import llama_index.core
          import qdrant_client
          import pymysql
          import sqlalchemy
          import typer
          import yaml
          print('All imports OK')
          "

      - name: Smoke test — CLI help
        run: |
          docker run --rm \
            -e LLM_PROVIDER=mock \
            -e OPENAI_API_KEY=sk-test-dummy \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python main.py --help

      - name: Push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
