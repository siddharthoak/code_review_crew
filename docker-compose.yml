# ─────────────────────────────────────────────────────────────────────────────
# AI Code Review Crew — Full Stack
#
# Services (managed by this compose):
#   qdrant      → vector store        http://localhost:6333/dashboard
#   mysql       → metadata store      localhost:3307
#   redis       → cache + memory      localhost:6380
#   ingest      → one-shot KB job
#   app         → review crew CLI
#
# External services (already running — not managed here):
#   ollama      → LLM server          host.docker.internal:11434
#   halo_mysql  → Halo DB             localhost:3306  (untouched)
#   halo_redis  → Halo cache          localhost:6379  (untouched)
#
# First run:
#   docker compose up                     # brings everything up + runs ingest
#
# Daily use:
#   docker compose up -d                  # start all in background
#   docker compose exec app python main.py review --file src/foo.py
#   docker compose run --rm ingest        # re-ingest after KB update
#   docker compose down                   # stop all (data persists in volumes)
#   docker compose down -v                # stop all AND wipe all volumes
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  LLM_PROVIDER:         ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL:      http://host.docker.internal:11434
  OLLAMA_LLM_MODEL:     ${OLLAMA_LLM_MODEL:-llama3.2}
  OLLAMA_EMBED_MODEL:   ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  OPENAI_API_KEY:       ${OPENAI_API_KEY:-}
  QDRANT_HOST:          qdrant
  QDRANT_PORT:          6333
  REDIS_URL:            redis://redis:6379/0
  MYSQL_HOST:           mysql
  MYSQL_PORT:           3306
  MYSQL_DB:             ${MYSQL_DB:-code_review}
  MYSQL_USER:           ${MYSQL_USER:-crew}
  MYSQL_PASSWORD:       ${MYSQL_PASSWORD:-crew_secret}

services:

  # ── MySQL — metadata store ────────────────────────────────────────────────
  # Isolated from halo_mysql — owns port 3307 on the host.
  # CLI: docker compose exec mysql mysql -u crew -pcrew_secret code_review
  mysql:
    image: mysql:8.4
    container_name: code_review_mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_DATABASE:      ${MYSQL_DB:-code_review}
      MYSQL_USER:          ${MYSQL_USER:-crew}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-crew_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # ── Redis — cache + CrewAI memory ─────────────────────────────────────────
  # Isolated from halo_redis — owns port 6380 on the host.
  # CLI: docker compose exec redis redis-cli
  redis:
    image: redis:7.4-alpine
    container_name: code_review_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Qdrant — vector store ──────────────────────────────────────────────────
  # Dashboard:  http://localhost:6333/dashboard
  # REST API:   http://localhost:6333
  # gRPC:       localhost:6334
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: code_review_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── KB Ingestion — one-shot job ────────────────────────────────────────────
  # Runs after Ollama models are pulled + Qdrant is ready.
  # Indexes knowledge_base/ into Qdrant using the configured embedding model.
  # Re-run after updating KB docs: docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_review_ingest
    command: >
      sh -c "
        echo '=== Ingesting OWASP standards ===' &&
        python main.py ingest owasp_standards --dir knowledge_base/owasp &&
        echo '=== Ingesting Org ADRs ===' &&
        python main.py ingest org_adrs --dir knowledge_base/standards &&
        echo '=== Ingestion complete ==='
      "
    environment:
      <<: *common-env
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  # ── App — main review CLI ──────────────────────────────────────────────────
  # Interactive use:
  #   docker compose exec app python main.py review --file /reviews/my_code.py
  #
  # Mount any local directory to /reviews for easy file access:
  #   docker compose run --rm -v $(pwd)/src:/reviews app \
  #     python main.py review --file /reviews/service.py
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_review_app
    command: ["python", "-c", "print('Code Review Crew ready. Use: docker compose exec app python main.py review --help')"]
    environment:
      <<: *common-env
      GOOGLE_CREDENTIALS_PATH: /app/credentials/google_oauth_credentials.json
      GOOGLE_TOKEN_PATH:        /app/credentials/google_token.json
    volumes:
      - ./reports:/app/reports
      - ./credentials:/app/credentials
      - ./knowledge_base:/app/knowledge_base:ro
    ports:
      - "8000:8000"                        # reserved for FastAPI demo UI (Phase 2)
    depends_on:
      qdrant:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local