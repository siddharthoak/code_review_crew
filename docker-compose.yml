# ─────────────────────────────────────────────────────────────────────────────
# AI Code Review Crew — Full Stack
#
# Services:
#   ollama      → local LLM + embedding server  (http://localhost:11434)
#   qdrant      → vector store                  (http://localhost:6333/dashboard)
#   redis       → caching + CrewAI memory store (localhost:6379)
#   mysql       → structured metadata store     (localhost:3306)
#   ingest      → one-shot KB indexing job
#   app         → main review crew CLI / API
#
# First run:
#   docker compose up                     # brings everything up + runs ingest
#
# Daily use:
#   docker compose up -d                  # start all in background
#   docker compose exec app python main.py review --file src/foo.py
#   docker compose run --rm ingest        # re-ingest after KB update
#   docker compose down                   # stop all (data persists in volumes)
#   docker compose down -v                # stop all AND wipe all volumes
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  LLM_PROVIDER:         ${LLM_PROVIDER:-ollama}
  OLLAMA_BASE_URL:      http://ollama:11434
  OLLAMA_LLM_MODEL:     ${OLLAMA_LLM_MODEL:-llama3.2}
  OLLAMA_EMBED_MODEL:   ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  OPENAI_API_KEY:       ${OPENAI_API_KEY:-}
  QDRANT_HOST:          qdrant
  QDRANT_PORT:          6333
  REDIS_URL:            redis://redis:6379/0
  MYSQL_HOST:           mysql
  MYSQL_PORT:           3306
  MYSQL_DB:             ${MYSQL_DB:-code_review}
  MYSQL_USER:           ${MYSQL_USER:-crew}
  MYSQL_PASSWORD:       ${MYSQL_PASSWORD:-crew_secret}

services:

  # ── Ollama — local LLM server ──────────────────────────────────────────────
  # Web UI (via Open WebUI — optional): http://localhost:3000
  # API:                                http://localhost:11434
  #
  # GPU support: uncomment the `deploy` block below if you have an NVIDIA GPU.
  # CPU-only works fine for dev; llama3.2 runs comfortably on 8GB RAM.
  ollama:
    image: ollama/ollama:latest
    container_name: code_review_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama        # persists downloaded models
    environment:
      OLLAMA_KEEP_ALIVE: "24h"             # keep models hot in memory
      OLLAMA_NUM_PARALLEL: 2               # concurrent requests
    # ── GPU (NVIDIA) — uncomment to enable ──────────────────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # ── Model pull — pulls required models on first run, then exits ────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: code_review_ollama_pull
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "
        echo '=== Waiting for Ollama to be ready ===' &&
        until curl -sf http://ollama:11434/api/version; do sleep 3; done &&
        echo '=== Pulling LLM: ${OLLAMA_LLM_MODEL:-llama3.2} ===' &&
        ollama pull ${OLLAMA_LLM_MODEL:-llama3.2} &&
        echo '=== Pulling embeddings: ${OLLAMA_EMBED_MODEL:-nomic-embed-text} ===' &&
        ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} &&
        echo '=== Model pull complete ==='
      "
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Qdrant — vector store ──────────────────────────────────────────────────
  # Dashboard:  http://localhost:6333/dashboard
  # REST API:   http://localhost:6333
  # gRPC:       localhost:6334
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: code_review_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Redis — caching + CrewAI memory ───────────────────────────────────────
  # Used for:
  #   • Caching LLM responses (avoid re-hitting Ollama for identical prompts)
  #   • CrewAI short-term memory (when memory=True on the Crew)
  #   • Rate limiting / request deduplication (Phase 2)
  # CLI: docker compose exec redis redis-cli
  redis:
    image: redis:7.4-alpine
    container_name: code_review_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MySQL — structured metadata ───────────────────────────────────────────
  # Used for:
  #   • Storing review run history (file, context, timestamp, report path)
  #   • Agent evaluation results (quality scores per agent per run)
  #   • Phase 2: bug report index and triage history
  # CLI: docker compose exec mysql mysql -u crew -pcrew_secret code_review
  mysql:
    image: mysql:8.4
    container_name: code_review_mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # schema bootstrap
    environment:
      MYSQL_DATABASE:      ${MYSQL_DB:-code_review}
      MYSQL_USER:          ${MYSQL_USER:-crew}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-crew_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crew", "-pcrew_secret"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # ── KB Ingestion — one-shot job ────────────────────────────────────────────
  # Runs after Ollama models are pulled + Qdrant is ready.
  # Indexes knowledge_base/ into Qdrant using the configured embedding model.
  # Re-run after updating KB docs: docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_review_ingest
    command: >
      sh -c "
        echo '=== Ingesting OWASP standards ===' &&
        python main.py ingest owasp_standards --dir knowledge_base/owasp &&
        echo '=== Ingesting Org ADRs ===' &&
        python main.py ingest org_adrs --dir knowledge_base/standards &&
        echo '=== Ingestion complete ==='
      "
    environment:
      <<: *common-env
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: "no"

  # ── App — main review CLI ──────────────────────────────────────────────────
  # Interactive use:
  #   docker compose exec app python main.py review --file /reviews/my_code.py
  #
  # Mount any local directory to /reviews for easy file access:
  #   docker compose run --rm -v $(pwd)/src:/reviews app \
  #     python main.py review --file /reviews/service.py
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_review_app
    command: ["python", "-c", "print('Code Review Crew ready. Use: docker compose exec app python main.py review --help')"]
    environment:
      <<: *common-env
      GOOGLE_CREDENTIALS_PATH: /app/credentials/google_oauth_credentials.json
      GOOGLE_TOKEN_PATH:        /app/credentials/google_token.json
    volumes:
      - ./reports:/app/reports
      - ./credentials:/app/credentials
      - ./knowledge_base:/app/knowledge_base:ro
    ports:
      - "8000:8000"                        # reserved for FastAPI demo UI (Phase 2)
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local                          # persists pulled models between restarts
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  mysql_data:
    driver: local